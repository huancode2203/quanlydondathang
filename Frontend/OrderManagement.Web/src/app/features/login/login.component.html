<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-brand">
      <span>TP</span>
      <div><strong>Tâm Phúc</strong><small>Order Center</small></div>
    </div>

    <header>
      <h1 id="login-title">Đăng nhập</h1>
      <p>Quản lý đơn đặt hàng</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Tên đăng nhập</span>
        <input formControlName="username" autocomplete="username" placeholder="Nhập tên đăng nhập" />
      </label>
      <label>
        <span>Mật khẩu</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="Nhập mật khẩu" />
      </label>
      @if (error()) { <div class="login-error" role="alert">{{ error() }}</div> }
      <button class="ui-button ui-button--primary login-submit" type="submit" [disabled]="loading()">{{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}</button>
    </form>
  </section>
</main>
