<main class="login-page">
  <section class="login-panel">
    <div class="login-brand"><span>TP</span><div><strong>Tâm Phúc</strong><small>ORDER CENTER</small></div></div>
    <div class="login-copy"><p>ĐĂNG NHẬP HỆ THỐNG</p><h1>Quản lý đơn đặt hàng</h1><span>Nhập tài khoản được cấp để tiếp tục.</span></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label><span>Tên đăng nhập</span><input formControlName="username" autocomplete="username" /></label>
      <label><span>Mật khẩu</span><input type="password" formControlName="password" autocomplete="current-password" /></label>
      @if (error()) { <div class="login-error" role="alert">{{ error() }}</div> }
      <button type="submit" [disabled]="loading()">{{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}</button>
    </form>
    <p class="demo-note">Tài khoản demo: <b>admin</b> / <b>123456</b></p>
  </section>
  <aside><div><span>02</span><strong>đơn hàng mẫu</strong></div><div><span>05</span><strong>hàng hóa</strong></div><p>Dữ liệu được kết nối trực tiếp với SQL Server nội bộ.</p></aside>
</main>
